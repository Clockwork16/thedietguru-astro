[build]
  command = "npm run build"
  publish = "dist"

# Proxy WP REST API (used by frontend if needed at runtime)
[[redirects]]
  from = "/wp-json/*"
  to = "https://cms.thedietguru.org/wp-json/:splat"
  status = 200
  force = true

# Proxy wp-content (images, uploads, themes)
[[redirects]]
  from = "/wp-content/*"
  to = "https://cms.thedietguru.org/wp-content/:splat"
  status = 200
  force = true


